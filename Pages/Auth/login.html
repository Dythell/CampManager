<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - CampManager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="header">
        <i class="fas fa-campground icon"></i>
        <h1>CampManager</h1>
    </div>
    <div class="container">
        <h2>Вход</h2>
        <form id="loginForm">
            <label for="loginUsername"></label>
            <input type="text" id="loginUsername" placeholder="Логин" required>

            <label for="loginPassword"></label>
            <input type="password" id="loginPassword" placeholder="Пароль" required>

            <button type="submit">Войти</button>
        </form>
        <div id="loader" style="display: none; text-align: center; margin-top: 10px;">
            <span>⏳ Загрузка...</span>
        </div>

        <p id="loginError" class="error"></p>
        <div class="auth-prompt">
            <span>Нет аккаунта?</span>
            <a href="register.html" class="auth-link-btn register-btn">Регистрация</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
