<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - CampManager</title>
    <link rel="icon" href="https://localhost:7060/pages/galstuk.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="header">
        <i class="fas fa-campground icon"></i>
        <h1>CampManager</h1>
    </div>
    <div class="container">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <label for="registerUsername"></label>
            <input type="text" id="registerUsername" placeholder="Логин" required>

            <label for="registerPassword"></label>
            <div class="password-wrapper">
                <input type="password" id="registerPassword" placeholder="Пароль" required>
                <i class="fas fa-eye" id="togglePassword"></i>
            </div>

            <label for="registerRole"></label>
            <select id="registerRole" required>
                <option value="" disabled selected>Роль</option>
                <option value="Counselor">Вожатый</option>
                <option value="Admin">Администратор</option>
            </select>

            <div id="counselorFields" style="display: none;">
                <label for="registerSurname"></label>
                <input type="text" id="registerSurname" class="counselor-form-input" placeholder="Фамилия" required>

                <label for="registerName"></label>
                <input type="text" id="registerName" class="counselor-form-input" placeholder="Имя" required>

                <label for="registerPatronymic"></label>
                <input type="text" id="registerPatronymic" class="counselor-form-input" placeholder="Отчество" required>

                <label for="registerPhoneNumber"></label>
                <input
                  type="tel"
                  id="registerPhoneNumber"
                  class="counselor-form-input"
                  placeholder="+7 (___) ___-__-__"
                  pattern="^(\+7|8)[0-9]{10}$"
                  title="Номер в формате +71234567890 или 81234567890"
                  maxlength="12"
                  required
                >
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>
        <div id="loader" style="display: none; text-align: center; margin-top: 10px;">
            <span>⏳ Загрузка...</span>
        </div>
        <p id="registerError" class="error"></p>
        <div class="auth-prompt">
            <span>Уже есть аккаунт?</span>
            <a href="login.html" class="auth-link-btn login-btn">Войти</a>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
