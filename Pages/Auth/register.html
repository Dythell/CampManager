<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - CampManager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="header">
        <i class="fas fa-campground icon"></i>
        <h1>CampManager</h1>
    </div>
    <div class="container">
        <h2>Регистрация</h2>
        <form id="registerForm">

            <label for="registerUsername"></label>
            <input type="text" id="registerUsername" placeholder="Логин"required>

            <label for="registerPassword"></label>
            <input type="password" id="registerPassword" placeholder="Пароль"required>

            <label for="registerRole"></label>
            <select id="registerRole" required>
                <option value="" disabled selected>Роль</option>
                <option value="Counselor">Вожатый</option>
                <option value="Admin">Администратор</option>
            </select>

            <div id="counselorFields" style="display: none;">
                <label for="registerSurname"></label>
                <input type="text" id="registerSurname" class="counselor-form-input"placeholder="Фамилия">

                <label for="registerName"></label>
                <input type="text" id="registerName" class="counselor-form-input"placeholder="Имя">

                <label for="registerPatronymic"></label>
                <input type="text" id="registerPatronymic" class="counselor-form-input"placeholder="Отчество">

                <label for="registerPhoneNumber"></label>
                <input type="text" id="registerPhoneNumber" class="counselor-form-input"placeholder="Телефон">
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>
        <p id="registerError" class="error"></p>
        <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
    <script src="register.js"></script>
</body>
</html>
