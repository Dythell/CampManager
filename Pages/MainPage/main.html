<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная - CampManager</title>
  <link rel="icon" href="https://localhost:7060/pages/galstuk.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>CampManager</h1>
    <nav>
      <ul>
        <li><a href="../ProfilePage/profile.html" id="profileLink" style="display:none;">Профиль</a></li>
        <li><a href="#" id="logout" style="display:none;">Выход</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Добро пожаловать в CampManager!</h2>
    <p>Управляйте сменами, следите за расписанием и организуйте мероприятия для детей.</p>
    
    <div class="up-button-container">
      <button id="sessionDetailsBtn">Просмотреть детали смен</button>
    </div>

    <div class="buttons-container">
      <button id="createEventBtn">Создать мероприятие</button>
      <button id="templatesBtn">Шаблоны мероприятий</button>
      <button id="createSessionBtn">Создать смену</button>
      <button id="createChildBtn" style="display:none;">Добавить ребенка</button>
      <button id="manageGroupsBtn" style="display:none;">Создать отряд</button>
    </div>

    <section id="eventsSection">
      <h3>Список мероприятий</h3>
      <div id="eventsList" class="cards-container"></div>
    </section>

    <div id="editModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h3>Редактировать мероприятие</h3>
        <form id="editForm">
          <label>
            Название:
            <input type="text" id="editName" />
          </label>
          <label>
            Время:
            <input type="datetime-local" id="editDateTime" />
          </label>
          <label>
            Статус:
            <select id="editStatus">
              <option value="Scheduled">Запланировано</option>
              <option value="Completed">Завершено</option>
              <option value="Cancelled">Отменено</option>
            </select>
          </label>
          <label>
            Вожатый:
            <select id="editCounselor">
              <option value="">Не назначен</option>
            </select>
          </label>
          <button type="submit">Сохранить</button>
        </form>
      </div>
    </div>

  </main>

  <script src="main.js"></script>
</body>
</html>
