<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать отряд - CampManager</title>
    <link rel="stylesheet" href="groups.css">
</head>
<body>
    <header>
        <h1>Создание отряда</h1>
        <nav>
            <ul>
                <li><a href="../MainPage/main.html">Главная</a></li>
                <li><a href="#" id="logout">Выход</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Добавить новый отряд</h2>
            <form id="groupForm">
                <label for="groupName">Название отряда:</label>
                <input type="text" id="groupName" required>

                <label for="groupNumber">Номер отряда:</label>
                <input type="number" id="groupNumber" required>

                <label for="sessionSelect">Выберите смену:</label>
                <select id="sessionSelect" required>
                    <option value="">-- Выберите смену --</option>
                </select>

                <label for="counselorSelect">Выберите вожатого (для смены):</label>
                <select id="counselorSelect" required>
                    <option value="">-- Выберите вожатого --</option>
                </select>

                <button type="submit">Создать отряд</button>
            </form>
            <p id="groupError" class="error"></p>

            <section id="groupsSection">
                <h2>Список отрядов</h2>
                <table id="groupsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Номер</th>
                            <th>Смена</th>
                            <th>Ответственный вожатый</th>
                        </tr>
                    </thead>
                    <tbody id="groupsBody">
                    </tbody>
                </table>
            </section>
        </div>
    </main>
    <script src="groups.js"></script>
</body>
</html>
